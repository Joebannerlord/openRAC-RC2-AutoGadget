name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Ninja
        run: python -m pip install ninja
      - name: Set up CMake on Linux
        if: runner.os == 'Linux'
        run: python -m pip install 'cmake>=3.24'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the tag and fetch the pinned SDK
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          version=$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo '::error::The release tag must match the manifest version.'
            exit 1
          fi
          python tools/fetch_sdk.py
      - name: Build and package the mod
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          wrench_plugin=$(python tools/fetch_wrench_test.py "$PLATFORM")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWRENCH_TEST_PLUGIN:FILEPATH="$wrench_plugin"
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --build build --target release_zip
      - name: Validate the platform archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd build/dist
          sha256sum *-"$PLATFORM".zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            build/dist/*-${{ matrix.platform }}.zip
            build/dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish the tagged release
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-x86_64'
          path: artifacts
      - name: Verify and publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir dist
          for platform in windows-x86_64 linux-x86_64; do
            (cd "artifacts/$platform" && sha256sum --check --strict SHA256SUMS)
            cp artifacts/"$platform"/*-"$platform".zip dist/
          done
          (cd dist && sha256sum *.zip > SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          notes=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")
          test -n "$notes"
          gh release create "$TAG" --verify-tag --title "Auto Gadgets $TAG" --notes "$notes" \
            dist/*.zip dist/SHA256SUMS
